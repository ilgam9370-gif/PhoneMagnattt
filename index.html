const MF=[[.3,.28],[.6,.28],[1,.2],[1.6,.16],[3.5,.08]],MFm=MF.reduce((a,x)=>a+x[0]*x[1],0);
const mnGot=g=>g.o.map(i=>g.c[i]).filter(c=>c.k=='p').map(c=>byId(c.i)),mnSh=p=>p.p>=1e6?p.p/1e6+'М':Math.round(p.p/1e3)+'к';
function mnPrize(t){const l=P.filter(p=>p.p>=t*.8&&p.p<=t*1.25);return l.length?l[Math.floor(Math.random()*l.length)]:P.slice().sort((a,b)=>Math.abs(Math.log(a.p/t))-Math.abs(Math.log(b.p/t)))[0]}
function mnStart(){if(S.mn)return;let B,x=null;
 if(MS.bt=='p'){x=S.inv.find(y=>y.u==MS.u);if(!x)return toast('Выбери телефон');B=sv(byId(x.i))}else{B=MS.amt;if(S.bal<B)return toast('Недостаточно средств')}
 const m=MS.m,mu=B/mnK(m),v0=Math.max(mu,4500),q=Math.min(1,mu/v0),c=Array.from({length:25},()=>({k:'e'}));
 const ord=[...Array(25).keys()].map(i=>[Math.random(),i]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
 ord.slice(0,m).forEach(i=>c[i]={k:'m'});
 ord.slice(m).forEach(i=>{if(Math.random()<q){let r=Math.random(),f=3.5;for(const[a,w]of MF){r-=w;if(r<=0){f=a;break}}c[i]={k:'p',i:mnPrize(v0*f/MFm).i}}});
 if(x)S.inv=S.inv.filter(y=>y.u!=x.u);else S.bal-=B;
 S.mn={c,o:[],m,B,end:0};log('Мины ('+m+'): ставка '+f(B));hp('heavy');render()}
function mnOpen(i){const g=S.mn;if(!g||g.end||g.o.includes(i))return;g.o.push(i);
 if(g.c[i].k=='m'){hp('heavy');return mnBoom()}
 hp(g.c[i].k=='p'?'medium':'light');
 if(g.o.filter(j=>g.c[j].k!='m').length==25-g.m)return mnCash(1);render()}
function mnCash(force){const g=S.mn;if(!g||g.end)return;const got=mnGot(g);if(!got.length&&!force)return toast('Сначала найди телефон');
 got.forEach(p=>add(p.i));S.mw=(S.mw||0)+1;g.end='win';const v=sum(got);log('Мины: забрано '+got.length+' тел. на '+f(v));hp('heavy');
 sheet(`<h2 style="color:#4ade80">Добыча забрана</h2><div class="m2" style="margin:6px 0 12px">${got.length} тел. на ${f(v)}</div>${got.slice(0,6).map(p=>`<div class="hr"><span>${p.n}</span><span>${f(p.p)}</span></div>`).join('')}<div style="height:14px"></div><button class="btn p" onclick="mnDone()">Отлично</button>`);render()}
function mnBoom(){const g=S.mn,got=mnGot(g);let b=null;
 if(S.inv.length&&Math.random()*100<mnBurn(g.m)){const k=Math.floor(Math.random()*S.inv.length);b=byId(S.inv[k].i);S.inv.splice(k,1)}
 g.end='boom';g.burn=b?b.n:'';log('Мины: взрыв, сгорело '+f(g.B)+(got.length?' + '+got.length+' тел.':'')+(b?' + '+b.n:''));
