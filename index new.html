V.bp=()=>{const b=S.bp,lv=bpLv(),per=bpPer(),na=bpAvail(), rdy=k=>bpQs(k).some(x=>!S.bq[k].cl.includes(x[0])&&bpPr(k,x)>=x[3]),

  return cards+`<div class="bpbn ${Q.bn?'done':all?'rdy':''}"><div class="bpbd">${L.map(x=>`<i class="${Q.cl.includes(x[0])?'on':''}"></i>`).join('')}</div><div class="bpbt"><b>Бонус за все задания</b><span>${dn} из ${L.length}</span></div>${Q.bn?'<span class="bpqd">✓</span>':all?`<button class="bpqc" onclick="bpBN('${k}')">+${BP_BN[k]}</button>`:`<span class="bpqx">+${BP_BN[k]}</span>`}</div>`})();
 return `<div class="bpx ${b.pr?'gold':''}"><i class="dmsh"></i>

// Код сам хранит подарки и подпись, поэтому проверяется без сервера. Один раз на устройство.
const AC_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',AC_SEC='nowadays-offline-k1';
const acAll=()=>P.concat(PX),ph16=i=>parseInt(PH('ph'+i).slice(0,4),16),acMac=p=>BigInt('0x'+PH('ac1'+AC_SEC+p.toString()).slice(0,8)),acFmt=s=>s.match(/.{4}/g).join('-');
function acEnc(m,pi,bd){const pl=(BigInt(Math.round(m/100))<<31n)|(BigInt(pi?1:0)<<30n)|(BigInt(pi?ph16(pi):0)<<14n)|(BigInt(bd?1:0)<<13n)|(BigInt(bd>=7?7:bd&7)<<10n)|BigInt(bd>=7?((Math.floor(Math.random()*1024)&~7)|(bd-7)):Math.floor(Math.random()*1024)),n=(pl<<32n)|acMac(pl);let s='';
 for(let i=0;i<16;i++)s+=AC_AL[Number((n>>BigInt(5*(15-i)))&31n)];return s}
function acDec(k){if(k.length!=16)return null;let n=0n;for(const c of k){const v=AC_AL.indexOf(c);if(v<0)return null;n=(n<<5n)|BigInt(v)}
 const pl=n>>32n;if((n&0xFFFFFFFFn)!=acMac(pl))return null;
 const g={m:Number(pl>>31n)*100,b:((pl>>13n)&1n)?(t=>t==7?((e=>e<=4?7+e:1)(Number(pl&7n))):(t>=1&&t<=4)||t==6?t:1)(Number((pl>>10n)&7n)):0,p:null};
 if((pl>>30n)&1n){const h=Number((pl>>14n)&0xFFFFn),l=acAll().filter(p=>ph16(p.i)==h);if(l.length!=1)return null;g.p=l[0]}
 return g}
function acDesc(g){return [g.m?f(g.m):'',g.p?g.p.n:'',g.b?'значок «'+BD_N[g.b]+'»':''].filter(Boolean).join(' + ')}
function acUse(k,g){const h=PH('ac'+k);if(S.pu.includes(h))return toast('Этот код уже активирован');
 S.pu.push(h);if(g.m)S.bal+=g.m;if(g.p)add(g.p.i);if(g.b)bdGive(g.b,1);log('Код: '+acDesc(g));hp('heavy');render();
 sheet(`<h2 style="color:#4ade80;margin-bottom:6px">Подарок получен</h2>${g.m?`<div class="big" style="margin:14px 0">+${f(g.m)}</div>`:''}${g.p?`<div class="r${g.p.r}">${ph(g.p)}<h2>${g.p.n}</h2><div style="color:var(--fg);font-weight:700;margin:4px 0 12px">${RN[g.p.r]} · ${f(g.p.p)}</div></div>`:''}${g.b?`<div style="width:72px;height:72px;margin:10px auto">${bdg(g.b,'vb','width:72px;height:72px;margin:0')}</div><div class="m2" style="margin-bottom:12px">Значок «${BD_N[g.b]}» рядом с именем в профиле</div>`:''}<button class="btn p" onclick="${g.p?"go('inv')":'cl()'}">${g.p?'В инвентарь':'Отлично'}</button>`)}
function acMake(){const m=Math.round((+($('#acm').value)||0)/100)*100,pi=$('#acp').value,bd=+$('#acb').value||0;
 if(m<0||m>13107100)return toast('Сумма от 0 до 13 107 100 ₽');if(!m&&!pi&&!bd)return toast('Выбери хотя бы один подарок');

 const c=acEnc(m,pi,bd),g=acDec(c);S.ac=S.ac||[];S.ac.unshift({c,d:acDesc(g)});S.ac.length=Math.min(S.ac.length,50);hp('heavy');render();
 sheet(`<h2 style="margin-bottom:6px">Код создан</h2><div class="m2" style="margin-bottom:12px">${acDesc(g)}</div><div class="pc" style="font-size:22px;font-weight:700;letter-spacing:.08em">${acFmt(c)}</div><button class="btn p" onclick="acCopy('${c}')">Копировать</button><button class="btn g" onclick="cl()">Закрыть</button>`)}

function acCp2(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано')}catch(e){toast(t)}a.remove()}

<select class="ain" id="acb"><option value="0">Без значка</option><option value="1">Галочка</option><option value="2">Медиа-партнёр</option><option value="3">Тестер</option><option value="4">Модератор</option><option value="6">Олд</option><option value="7">Дизайнер</option><option value="8">Саппорт</option><option value="9">Багхантер</option><option value="10">Спонсор</option><option value="11">Организатор</option></select><button class="btn p" style="margin-top:8px" onclick="acMake()">Создать код</button>
${(S.ac||[]).map(x=>`<div class="cr"><div style="flex:1;min-width:0"><b style="letter-spacing:.05em;font-size:14px">${acFmt(x.c)}</b><div class="m2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.d}</div></div><button class="cb" style="background:var(--ac2)" onclick="acCopy('${x.c}')">Копия</button></div>`).join('')}</div>`}
